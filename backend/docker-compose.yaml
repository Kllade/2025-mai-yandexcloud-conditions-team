version: '3.9'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - api/.env
    restart: on-failure
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - python_network

  postgres_main:
    image: postgres:13-alpine
    env_file:
      - bot/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: on-failure
    ports:
      - "5433:5432"
    networks:
      - python_network
    expose:
      - 5432

volumes:
  postgres_data: 


networks:
  python_network:
    driver: bridge